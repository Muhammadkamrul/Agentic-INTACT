# ===========================================================================
# S12 -- Inward migration where the wasted reservation is NEEDED
# ===========================================================================
# WHAT S12 CHANGES FROM S11
# --------------------------
# S11's scheduled-policy test (3 seeds, common random numbers verified to
# the sixth decimal) found the value of releasing T1's reservation after it
# moved inward to be -0.0025 +/- 0.048: nothing.  The cause was measured,
# not guessed: near the site T2 carries ~61 Mb/s on its 34 reserved PRBs
# against 42 Mb/s of overload demand, so it was NEVER reservation-limited
# and the released PRBs had nowhere useful to go.
#
# S12 sizes the out-of-phase loads so that the capacity T1 wastes is
# exactly what the currently overloaded tenant needs:
#   T2  4.5 Mb/s/UE  -> 72 Mb/s in overload: limited while T1 holds its
#                       reservation (~61 Mb/s), served once released (~87)
#   T3  1.4 Mb/s/UE  -> 31 Mb/s in overload: limited while held (~24),
#                       served once released (~36)
# T2 and T3 alternate, so one of them is always the tenant that needs it.
#
# WHY THE DIRECTION OF MIGRATION MATTERS
# --------------------------------------
# Measured on S10 (attainable-value sweep, three severities): after an
# OUTWARD migration, raising the migrating tenant's reservation never paid.
# At the edge its spectral efficiency collapses, so each extra PRB buys it
# little fulfilment while costing the other tenants more.  Under an
# unweighted fulfilment metric the efficient response is NOT to favour the
# migrating tenant -- and a frozen table, which underestimates its new
# need, already does exactly that.  The staleness pointed the right way.
#
# An INWARD migration reverses it.  T1's users move from the cell edge
# toward the site at CONSTANT offered load (a crowd converging on a venue
# near the gNB).  Near the site T1 becomes DEMAND-limited: it needs far
# fewer PRBs for the same traffic.  The offline table, calibrated with T1
# at the edge where it was capacity-limited, still records a large T1 quota
# slope, so a controller trusting it protects T1's reservation and refuses
# to release it.  Under DEDICATED reservations an unused reserved PRB is
# WASTED -- no other slice may use it -- so T2 and T3 starve beside idle
# capacity.  A current estimate sees T1's slope collapse and releases it.
# Here the stale table points the WRONG way, which is the condition under
# which current sensitivity knowledge can have value.
#
# Because T1's offered load never changes, its per-tenant LOAD label never
# changes either, so INTACT-RA keeps reading the edge-calibrated column.
# What does change is its resource pressure, which is what the agentic
# context head estimates.
#
# SCOPE CONDITIONS (reported with the claim)
#  * normalised dedicated PRB reservations with the unreserved remainder
#    shared (3GPP RRM policy semantics)
#  * out-of-phase load on T2/T3            -> separates INTACT-RA from B3
#  * constant-load inward migration of T1  -> separates Agentic from INTACT-RA
#  * SLAs provisioned with headroom (75% compliance, pre-migration window)
#  * the host power cap is a FIXED operator constraint, not a counted intent:
#    transmit power and tilt are held at their provisioned values
#  * reconfiguration transients make indiscriminate writing expensive

_scenario_note: >
  Constant-load inward migration of T1 from the cell edge toward the site
  under normalised dedicated reservations, with T2/T3 out of phase. A frozen
  table calibrated at the edge keeps protecting T1's now-unused reservation.

run:
  epochs: 500

_replace_sections: [intents, xapps, claims]

claims:
  - {jid: j4, xapp: tput_T1,   tenant: T1, param: quota_T1, scope: slice,
     kind: allocative, domain: [10.0, 60.0], step: 1.0, max_step_frac: 0.15,
     resource: prb, d_bar: 60.0, r_j: 0.70}
  - {jid: j5, xapp: lat_T2,    tenant: T2, param: quota_T2, scope: slice,
     kind: allocative, domain: [10.0, 54.0], step: 1.0, max_step_frac: 0.15,
     resource: prb, d_bar: 54.0, r_j: 0.65}
  - {jid: j6, xapp: rob_T3,    tenant: T3, param: quota_T3, scope: slice,
     kind: allocative, domain: [6.0, 44.0], step: 1.0, max_step_frac: 0.15,
     resource: prb, d_bar: 44.0, r_j: 0.45}

xapps:
  - {name: tput_T1, kind: throughput, tenant: T1, param: quota_T1,
     domain: [10.0, 60.0], step: 1.0, gain: 2.4, target: 1.5, deadband: 0.10}
  - {name: lat_T2,  kind: latency,    tenant: T2, param: quota_T2,
     domain: [10.0, 54.0], step: 1.0, gain: 0.5, target: 5.0, deadband: 0.5}
  - {name: rob_T3,  kind: throughput, tenant: T3, param: quota_T3,
     domain: [6.0, 44.0], step: 1.0, gain: 3.0, target: 0.7, deadband: 0.05}

tenants:
  - {tid: T1, omega: 1.0, rho_min: 0.80, envelope: {prb: 60.0}}
  - {tid: T2, omega: 1.0, rho_min: 0.80, envelope: {prb: 54.0}}
  - {tid: T3, omega: 1.0, rho_min: 0.75, envelope: {prb: 44.0}}
  - {tid: HOST, omega: 1.0, rho_min: 0.60, is_host: true, envelope: {}}

ran:
  allocation: dedicated_shared
  envelopes:
    T1: {prb: 60.0}
    T2: {prb: 54.0}
    T3: {prb: 44.0}
  initial_controls:
    txpower: 40.0
    tilt: 8.0
    quota_T1: 50.0          # provisioned for T1 at the edge, where it is
    quota_T2: 38.0          # capacity-limited; sum 118 > 106 so the pool is
    quota_T3: 30.0          # always fully reserved
  slices:
    T1:
      load_mbps_per_ue: 2.2
      placement: {radius_min_m: 250.0, radius_max_m: 310.0}
      load_profile: {levels: [1.0], hold_slots: 1000000, phase: 0}
    T2:
      load_mbps_per_ue: 4.5
      load_profile: {levels: [1.60, 0.60], hold_slots: 700, ramp_slots: 100, phase: 0}
    T3:
      load_mbps_per_ue: 1.4
      load_profile: {levels: [0.60, 1.60], hold_slots: 700, ramp_slots: 100, phase: 0}
  mobility:
    mode: group_drift
    drift:
      tenants: [T1]
      rate_m_per_slot: -0.028     # NEGATIVE = inward: ~280 m -> ~100 m
      start_slot: 1600            # epochs 0-99 stationary: the SLA window
      jitter_m_per_slot: 0.10
    wander_radius_m: 35.0

gates:
  oracle_gain_min: 0.030
  control_gain_min: 0.030
  conflict_gain_min: 0.030
  agentic_gain_min: 0.010

