# ===========================================================================
# S8 -- Dedicated-reservation contest: THE HEADLINE SCENARIO
# ===========================================================================
# Every condition below is a physical precondition for current sensitivity
# knowledge to have decision value.  Each was established by a paired
# counterfactual measurement BEFORE any controller was scored on S8, and
# each maps to one rung of the comparison ladder.  These conditions are the
# SCOPE of the headline claim and must be reported with it.
#
# (1) NORMALISED DEDICATED RESERVATIONS          (choice beats count)
#     ran.allocation: dedicated.  A slice's quota reserves PRBs that no
#     other slice may use; reservations are normalised so they never exceed
#     the pool (3GPP dedicated-ratio semantics).  Quotas start summing to
#     118 > 106 PRB, so the pool is always fully reserved: granting one
#     tenant more shrinks every other reservation, and giving PRBs to a
#     tenant that cannot use them wastes them.
#
# (2) OUT-OF-PHASE PER-TENANT LOAD               (B3 -> INTACT-RA)
#     Measured, paired, +8 PRB to T1:
#         T1 0.6x / T2 1.6x :  dT1 +0.001  dT2 -0.059   NET -0.070  harmful
#         T1 1.6x / T2 0.6x :  dT1 +0.220  dT2  0.000   NET +0.207  helpful
#     The SAME write changes sign with WHICH tenant is loaded.  T1 and T2
#     alternate between 0.6x and 1.6x while the cell average barely moves.
#     INTACT-RA reads each tenant's slopes from that tenant's own regime and
#     gets both cases right; B3 reads one cell-average column for everyone.
#
# (3) OUTWARD MIGRATION AT CONSTANT LOAD         (INTACT-RA -> Agentic)
#     T1 walks from ~163 m across the antenna beam peak (h_bs/tan 8deg =
#     178 m).  Its spectral efficiency falls, so each reserved PRB is worth
#     less to it, and d(g)/d(tilt) reverses sign.  Its offered LOAD is
#     unchanged, so the per-tenant load label indexing INTACT-RA's frozen
#     table does not move.  Only a current estimate can notice.
#
# (4) MODERATE ACTUATION COST                    (all-accept must lose)
#     Reconfiguration transients make indiscriminate writing expensive.
#
# (5) CALIBRATED SETPOINTS                       (no ratchet)
#     Intent targets and xApp setpoints at the passive-plant median, by
#     scripts/calibrate_targets.py.

_scenario_note: >
  Normalised dedicated PRB reservations, out-of-phase per-tenant load and
  constant-load outward migration of T1 across the antenna beam peak.
  Each mechanism corresponds to one rung of the
  B3 < INTACT-RA < INTACT-RA-Agentic <= Oracle ladder.

run:
  epochs: 800

ran:
  allocation: dedicated
  initial_controls:
    tilt: 8.0
    quota_T1: 46.0
    quota_T2: 42.0
    quota_T3: 30.0
  slices:
    T1:
      load_profile: {levels: [0.60, 1.60], hold_slots: 700, ramp_slots: 100, phase: 0}
    T2:
      load_profile: {levels: [1.60, 0.60], hold_slots: 700, ramp_slots: 100, phase: 0}
    T3:
      load_profile: {levels: [1.0], hold_slots: 1000000, phase: 0}
  mobility:
    mode: group_drift
    drift:
      tenants: [T1]
      rate_m_per_slot: 0.0140
      start_slot: 400
      jitter_m_per_slot: 0.10
    wander_radius_m: 35.0

gates:
  oracle_gain_min: 0.030
  knowledge_gain_min: 0.050
  control_gain_min: 0.030
  conflict_gain_min: 0.030
  agentic_gain_min: 0.010

